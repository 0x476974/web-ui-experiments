<!DOCTYPE html>
<html lang="en">
<head>
    <title>All about radio button</title>
    <link rel="icon" href="assets/images/favicon.ico" type="image/x-icon"/>

    <meta charset="UTF-8"/>
    <meta name="keywords" content=""/>
    <meta name="description" content=""/>
    <meta name="author" content="pxoqxo"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <link rel="stylesheet" href="src/theme.css" type="text/css"/>
    <link rel="stylesheet" href="src/gy-radio.css" type="text/css"/>

    <script src="src/theme.js" type="text/javascript"></script>
    <script src="src/gy-radio.js" type="text/javascript"></script>

    <style>
        .stack-panel {
            display: flex;
            flex-direction: row;
            gap: 10px;
            justify-content: center;
            align-items: center;
            margin: 10px auto;
        }
    </style>
    <script>
        function update(e) {
            console.log(`-> State: ${e.detail.state}, Value: ${e.detail.value}`);
        }
    </script>
</head>
<body>
<div class="stack-panel">
    <p>Radio Button: No Style</p>
    <gy-radio text="Mail?" name="gender" value="male" onchange="update(event)" state="checked"></gy-radio>
    <gy-radio text="Femail?" name="gender" value="female" onchange="update(event)"></gy-radio>
    <gy-radio text="Gmail?" name="gender" value="gmail" onchange="update(event)"></gy-radio>
</div>
<div class="stack-panel">
    <p>Radio Button: Primary</p>
    <gy-radio class="primary" text="Ganeshotsav" name="festival" value="1" state="checked"></gy-radio>
    <gy-radio class="primary" text="Navratri" name="festival" value="2"></gy-radio>
    <gy-radio class="primary" text="Diwali" name="festival" value="3"></gy-radio>
    <gy-radio class="primary" text="Chhath Puja" name="festival" value="4"></gy-radio>
</div>
<div class="stack-panel">
    <p>Radio Button: Secondary</p>
    <gy-radio class="secondary" text="Windows" name="os" value="win" state="checked"></gy-radio>
    <gy-radio class="secondary" text="macOS" name="os" value="osx"></gy-radio>
    <gy-radio class="secondary" text="Penguin" name="os" value="linux"></gy-radio>
</div>
<div class="stack-panel">
    <p>Radio Button: Disabled</p>
    <gy-radio disabled text="Google" name="company" value="google" state="checked"></gy-radio>
    <gy-radio disabled text="Microsoft" name="company" value="microsoft"></gy-radio>
    <gy-radio disabled text="Adobe" name="company" value="adobe"></gy-radio>
    <gy-radio disabled text="Pxoqxo" name="company" value="pxoqxo"></gy-radio>
</div>
</body>
</html>

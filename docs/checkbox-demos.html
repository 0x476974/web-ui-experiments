<!DOCTYPE html>
<html lang="en">
<head>
    <title>All about checkbox</title>
    <link rel="icon" href="assets/images/favicon.ico" type="image/x-icon"/>

    <meta charset="UTF-8"/>
    <meta name="keywords" content=""/>
    <meta name="description" content=""/>
    <meta name="author" content="pxoqxo"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <link rel="stylesheet" href="src/theme.css" type="text/css"/>
    <link rel="stylesheet" href="src/gy-checkbox.css" type="text/css"/>

    <script src="src/theme.js" type="text/javascript"></script>
    <script src="src/gy-checkbox.js" type="text/javascript"></script>

    <style>
        .stack-panel {
            display: flex;
            flex-direction: row;
            gap: 10px;
            justify-content: center;
            align-items: center;
            margin: 10px auto;
        }
    </style>
    <script>
        function update(e) {
            console.log(`-> State: ${e.detail.state}, Value: ${e.detail.value}`);
        }
    </script>
</head>
<body>
<div class="stack-panel">
    <p>Checkbox: No Style</p>
    <gy-checkbox text="Are you developer?" value="yes"></gy-checkbox>
    <gy-checkbox text="Want updates??" state="checked" value="true" onchange="update(event)"></gy-checkbox>
</div>
<div class="stack-panel">
    <p>Checkbox: Primary</p>
    <gy-checkbox class="primary" text="Are you developer?" value="yes"></gy-checkbox>
    <gy-checkbox class="primary" text="Want updates??" state="checked" value="true"></gy-checkbox>
</div>
<div class="stack-panel">
    <p>Checkbox: Secondary</p>
    <gy-checkbox class="secondary" text="Are you developer?" value="yes"></gy-checkbox>
    <gy-checkbox class="secondary" text="Want updates??" state="checked" value="true"></gy-checkbox>
</div>
<div class="stack-panel">
    <p>Checkbox: Disabled</p>
    <gy-checkbox disabled text="Are you developer?" value="yes"></gy-checkbox>
    <gy-checkbox disabled text="Want updates??" state="checked" value="true"></gy-checkbox>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <title>All about buttons</title>
    <link rel="icon" href="assets/images/favicon.ico" type="image/x-icon"/>

    <meta charset="UTF-8"/>
    <meta name="keywords" content=""/>
    <meta name="description" content=""/>
    <meta name="author" content="pxoqxo"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <link rel="stylesheet" href="src/theme.css" type="text/css"/>
    <link rel="stylesheet" href="src/gy-button.css" type="text/css"/>

    <script src="src/theme.js" type="text/javascript"></script>
    <script src="src/gy-button.js" type="text/javascript"></script>

    <style>
        .stack-panel {
            display: flex;
            flex-direction: row;
            gap: 10px;
            justify-content: center;
            align-items: center;
            margin: 10px auto;
        }
    </style>
</head>
<body>
<div class="stack-panel">
    <p>Button: No Style</p>
    <gy-button icon="F3ED"></gy-button>
    <gy-button text="Github"></gy-button>
    <gy-button icon="F3ED" text="Github" gap="5px"></gy-button>
    <gy-button icon="F647" text="Mastodon" gap="5px" position="row"></gy-button>
    <gy-button icon="F647" text="Mastodon" gap="5px" position="row-reverse"></gy-button>
    <gy-button icon="F647" text="Mastodon" gap="5px" position="column" size="2em"></gy-button>
    <gy-button icon="F647" text="Mastodon" gap="5px" position="column-reverse" size="2em"></gy-button>
</div>
<div class="stack-panel">
    <p>Button: Primary</p>
    <gy-button class="primary" icon="F3ED"></gy-button>
    <gy-button class="primary" text="Github"></gy-button>
    <gy-button class="primary" icon="F3ED" text="Github" gap="5px"></gy-button>
    <gy-button class="primary" icon="F647" text="Mastodon" gap="5px" position="row"></gy-button>
    <gy-button class="primary" icon="F647" text="Mastodon" gap="5px" position="row-reverse"></gy-button>
    <gy-button class="primary" icon="F647" text="Mastodon" gap="5px" position="column" size="2em"></gy-button>
    <gy-button class="primary" icon="F647" text="Mastodon" gap="5px" position="column-reverse" size="2em"></gy-button>
</div>
<div class="stack-panel">
    <p>Button: Secondary</p>
    <gy-button class="secondary" icon="F3ED"></gy-button>
    <gy-button class="secondary" text="Github"></gy-button>
    <gy-button class="secondary" icon="F3ED" text="Github" gap="5px"></gy-button>
    <gy-button class="secondary" icon="F647" text="Mastodon" gap="5px" position="row"></gy-button>
    <gy-button class="secondary" icon="F647" text="Mastodon" gap="5px" position="row-reverse"></gy-button>
    <gy-button class="secondary" icon="F647" text="Mastodon" gap="5px" position="column" size="2em"></gy-button>
    <gy-button class="secondary" icon="F647" text="Mastodon" gap="5px" position="column-reverse" size="2em"></gy-button>
</div>
<div class="stack-panel">
    <p>Button: Disabled</p>
    <gy-button disabled icon="F3ED"></gy-button>
    <gy-button disabled text="Github"></gy-button>
    <gy-button disabled icon="F3ED" text="Github" gap="5px"></gy-button>
    <gy-button disabled icon="F647" text="Mastodon" gap="5px" position="row"></gy-button>
    <gy-button disabled icon="F647" text="Mastodon" gap="5px" position="row-reverse"></gy-button>
    <gy-button disabled icon="F647" text="Mastodon" gap="5px" position="column" size="2em"></gy-button>
    <gy-button disabled icon="F647" text="Mastodon" gap="5px" position="column-reverse" size="2em"></gy-button>
</div>
</body>
</html>
